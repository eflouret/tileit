<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tileit — Próximamente</title>
  <meta name="description" content="Tileit — Próximamente.">
  <meta name="robots" content="noindex">

  <link rel="icon" href="images/favicon/favicon.ico" sizes="any">
  <link rel="icon" href="images/favicon/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="images/favicon/favicon-96x96.png" sizes="96x96" type="image/png">
  <link rel="apple-touch-icon" href="images/favicon/apple-touch-icon.png">
  <link rel="manifest" href="images/favicon/site.webmanifest">
  <meta name="theme-color" content="#fafafa">

  <style>
    :root {
      --bg: #fafafa;
      --fg: #0a0a0a;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      padding: 2rem 1.5rem;
      text-align: center;
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo {
      width: min(260px, 68vw);
      height: auto;
      display: block;
    }

    .spacer {
      height: clamp(1.75rem, 5vw, 2.5rem);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 5vw, 2.25rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    p {
      margin: 0;
      max-width: 34ch;
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.6;
      color: var(--fg);
      opacity: 0.6;
    }

    footer {
      font-size: 0.8125rem;
      opacity: 0.45;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo-wrap">
      <img class="logo" src="images/logo.png" alt="Tileit" width="260" height="63">
    </div>
    <div class="spacer"></div>
    <h1>Próximamente</h1>
    <p>Estamos preparando algo nuevo. Volvé muy pronto.</p>
  </main>
</body>
</html>
